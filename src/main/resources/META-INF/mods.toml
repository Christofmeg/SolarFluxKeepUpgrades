modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/Christofmeg/SolarFluxKeepUpgrades/issues"
license="${mod_license}"
[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/Christofmeg/SolarFluxKeepUpgrades"
    authors="${mod_authors}"
    description='''${mod_description}'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="solarflux"
    mandatory=true
    versionRange="[20.1,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="draconicevolution"
    mandatory=false
    versionRange="[3.1,)"
    ordering="AFTER"
    side="BOTH"
