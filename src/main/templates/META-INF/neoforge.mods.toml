modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/Christofmeg/SolarFluxKeepUpgrades/issues"
license="${mod_license}"
[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/Christofmeg/SolarFluxKeepUpgrades"
    authors="Christofmeg"
    description="Prevents accidental voiding of solar panel upgrades."
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="solarflux"
    type="required"
    versionRange="ANY"
    ordering="AFTER"
    side="BOTH"